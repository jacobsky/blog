# Personal blog with RSS feed and tags

base_url = "https://apparently-typ.ing"
title = "> Apparently Typing"
description = "The nerdy musings of an internet denizen"
theme = "tabi"
compile_sass = true
build_search_index = true
generate_feeds = false

taxonomies = [
    { name = "tags", feed = false },
]

[extra]
# Tabi reads navigation from `menu`
menu = [
    { name = "blog", url = "blog", trailing_slash = true },
    { name = "about", url = "about", trailing_slash = true },
]

# Author configuration
[extra.author]
name=""
bio="A nerdy technology focused internet denizen"

